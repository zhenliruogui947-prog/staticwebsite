<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" role="img" aria-label="hair salon URU by charmant">
  <title>hair salon URU by charmant</title>

  <!-- laurel stems -->
  <path d="M100,216 C70,211 40,196 32,160 C25,126 40,106 70,91"
        fill="none" stroke="#1f6aa8" stroke-width="1.4" stroke-linecap="round" />
  <path d="M100,216 C130,211 160,196 168,160 C175,126 160,106 130,91"
        fill="none" stroke="#1f6aa8" stroke-width="1.4" stroke-linecap="round" />

  <!-- ribbon knot at base -->
  <circle cx="100" cy="219" r="3.2" fill="#1f6aa8" />

  <!-- left leaves -->
  <g fill="#1f6aa8">
    <ellipse cx="87.9" cy="212.1" rx="11" ry="4.2" transform="rotate(190 87.9 212.1)" />
    <ellipse cx="60.9" cy="202.2" rx="11" ry="4.2" transform="rotate(214 60.9 202.2)" />
    <ellipse cx="40.6" cy="183.4" rx="11" ry="4.2" transform="rotate(238 40.6 183.4)" />
    <ellipse cx="30.7" cy="158.8" rx="11" ry="4.2" transform="rotate(262 30.7 158.8)" />
    <ellipse cx="32.7" cy="132.6" rx="11" ry="4.2" transform="rotate(286 32.7 132.6)" />
    <ellipse cx="46.4" cy="109.5" rx="11" ry="4.2" transform="rotate(310 46.4 109.5)" />
    <ellipse cx="69.3" cy="93.4" rx="11" ry="4.2" transform="rotate(334 69.3 93.4)" />
  </g>

  <!-- right leaves (mirrored) -->
  <g fill="#1f6aa8">
    <ellipse cx="112.1" cy="212.1" rx="11" ry="4.2" transform="rotate(-10 112.1 212.1)" />
    <ellipse cx="139.1" cy="202.2" rx="11" ry="4.2" transform="rotate(-34 139.1 202.2)" />
    <ellipse cx="159.4" cy="183.4" rx="11" ry="4.2" transform="rotate(-58 159.4 183.4)" />
    <ellipse cx="169.3" cy="158.8" rx="11" ry="4.2" transform="rotate(-82 169.3 158.8)" />
    <ellipse cx="167.3" cy="132.6" rx="11" ry="4.2" transform="rotate(-106 167.3 132.6)" />
    <ellipse cx="153.6" cy="109.5" rx="11" ry="4.2" transform="rotate(-130 153.6 109.5)" />
    <ellipse cx="130.7" cy="93.4" rx="11" ry="4.2" transform="rotate(-154 130.7 93.4)" />
  </g>

  <!-- wordmark -->
  <text x="100" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="12" font-weight="600" letter-spacing="4" fill="#1f3348">HAIR SALON</text>
  <text x="100" y="110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="46" font-weight="700" letter-spacing="2" fill="#1f6aa8">URU</text>
  <text x="100" y="140" text-anchor="middle" font-family="'Segoe Script','Brush Script MT',cursive,Georgia,serif"
        font-size="17" font-style="italic" fill="#1f3348">by charmant</text>
</svg>
